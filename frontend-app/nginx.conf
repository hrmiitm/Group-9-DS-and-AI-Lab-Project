# ─────────────────────────────────────────────────────────────────────────────
# nginx.conf — FraudGuard Frontend
#
# Key responsibilities:
#   1. Listen on port 7860 (HuggingFace Spaces requirement)
#   2. Serve the React SPA from /usr/share/nginx/html
#   3. Fallback ALL unknown paths to index.html (client-side routing)
#   4. Serve static assets with long-lived cache headers
#   5. Enable gzip compression for fast page loads
#   6. Add basic security headers
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen       7860;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ───────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── Security headers ───────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"           always;
    add_header X-Content-Type-Options "nosniff"              always;
    add_header Referrer-Policy        "strict-origin"        always;
    add_header X-XSS-Protection       "1; mode=block"        always;

    # ── Static asset caching ───────────────────────────────────────────────
    # Vite hashes asset filenames (e.g. main.BxK2a9Lp.js) so they can be
    # cached indefinitely — the hash changes on every rebuild.
    location ~* \.(js|css|woff2?|png|svg|ico|jpg|jpeg|webp|gif)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── index.html must NOT be cached ─────────────────────────────────────
    # The browser must always fetch a fresh index.html so it picks up new
    # hashed asset filenames after a redeployment.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
    }

    # ── React SPA fallback ────────────────────────────────────────────────
    # All routes that don't match a real file are served as index.html so
    # React Router can handle them on the client side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Health endpoint ───────────────────────────────────────────────────
    # Lets Docker HEALTHCHECK and HF Spaces probe the container cheaply
    # without hitting the full React app.
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── Error pages ───────────────────────────────────────────────────────
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
